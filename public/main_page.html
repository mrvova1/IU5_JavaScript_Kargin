<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="static/css/Main.css">
</head>
<body>
    <div id="navigation"></div>

    <div id="root"></div>
    <script src="static/js/main_page.js" type="module"></script>
</body>
</html>

<script>
    async function loadFragment(sel, url) {
        try {
            const res = await fetch(url);
            if (!res.ok) throw new Error(res.status);
            const html = await res.text();
            document.querySelector(sel).innerHTML = html;
        } catch(e) {
            console.error('Не удалось загрузить', url, e);
        }
    }
    loadFragment('#navigation', 'navigation.html')
</script>
